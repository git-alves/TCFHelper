name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Debug - inspect signup function's launcher and config
        run: |
          echo "--- .vc-config.json ---"
          cat .vercel/output/functions/api/auth/signup.func/.vc-config.json
          echo
          echo "--- ___next_launcher.cjs ---"
          cat .vercel/output/functions/api/auth/signup.func/___next_launcher.cjs
          echo
          echo "--- .next/server/app-paths-manifest.json ---"
          cat .vercel/output/functions/api/auth/signup.func/.next/server/app-paths-manifest.json
          echo
          echo "--- .next/server/pages-manifest.json ---"
          cat .vercel/output/functions/api/auth/signup.func/.next/server/pages-manifest.json
          echo
          echo "--- config.json ---"
          cat .vercel/output/config.json

      - name: Verify Prisma engine is packaged
        run: node scripts/verify-prisma-engine.mjs .vercel/output/functions

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
