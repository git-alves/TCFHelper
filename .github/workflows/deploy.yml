name: Deploy to Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two overlapping production deploys (e.g. two pushes to main in quick
# succession) would otherwise both run to completion, wasting a build.
# vercel-build never seeds or retires starter topics itself (see README's
# "Starter-topic bank rollout"), so this is purely about not wasting a build,
# not about write ordering.
concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --global vercel@latest

      - name: Request a Vercel-hosted production build
        run: vercel deploy --yes --prod --build-env RUN_PRODUCTION_MIGRATIONS=1 --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
