name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only — no real infrastructure is contacted.
      # Prisma's client generator reads the schema, it doesn't connect to
      # DATABASE_URL. Route handlers that need STRIPE_SECRET_KEY only touch
      # it at request time, not at build time.
      DATABASE_URL: "postgresql://user:password@localhost:5432/tcfhelper?schema=public"
      AUTH_SECRET: "ci-build-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      STRIPE_SECRET_KEY: "sk_test_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
      STRIPE_PRICE_ID: "price_placeholder"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

      - run: npm run verify:prisma-engine
