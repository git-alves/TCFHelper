name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only — no real infrastructure is contacted.
      # Prisma's client generator reads the schema, it doesn't connect to
      # DATABASE_URL. Route handlers that need STRIPE_SECRET_KEY only touch
      # it at request time, not at build time.
      DATABASE_URL: "postgresql://user:password@localhost:5432/tcfhelper?schema=public"
      # Valid-shaped non-production Clerk values stop keyless mode from
      # attempting to create an instance during the build. No Clerk API call
      # is made by the checks below.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2ktdGVzdC0xLmNsZXJrLmFjY291bnRzLmRldiQ"
      CLERK_SECRET_KEY: "sk_test_ci-placeholder"
      CLERK_WEBHOOK_SIGNING_SECRET: "whsec_ci-placeholder"
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/login"
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/signup"
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: "/dashboard"
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: "/dashboard"
      STRIPE_SECRET_KEY: "sk_test_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
      STRIPE_PRICE_ID: "price_placeholder"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

      - run: npm run verify:prisma-engine
